name: Test WSR polling service
on:
  push:
    paths:
      - services/wsr-polling/**
      - render-wsr.yaml
      - .github/workflows/test-wsr-polling.yml
  pull_request:
    paths:
      - services/wsr-polling/**
      - render-wsr.yaml
      - .github/workflows/test-wsr-polling.yml
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s services/wsr-polling/tests -v
