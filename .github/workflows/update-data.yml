name: Update ER Weather Observations
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "dist/**"
      - ".github/workflows/update-data.yml"
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: write
concurrency:
  group: er-weather-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Test data and display logic
        run: |
          python -m unittest discover -s tests
          node --test tests/*.test.mjs
          node --test cloudflare-worker/tests/*.test.mjs
          node --check dist/app.mjs
      - name: Fetch observations
        run: python scripts/collect_data.py
      - name: Collect previous-hour replay
        run: python scripts/collect_replay.py
      - name: Commit updated snapshot
        run: |
          git config user.name "er-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A dist/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Eastern Range observations"
          git pull --rebase -X theirs origin main
          git push origin HEAD:main
